# The keeper, on a schedule. It holds no user funds and decides nothing: it reads the users and autopilots from the
# router, simulates `tick`, and submits only when the router returns an action. Everything it may sign is confined
# on-chain by koul_agent_policy, so the worst a stolen run can do is what the user's own rules already allow.
name: keeper

on:
  schedule:
    # Hourly, as a fallback. A run ticks every 15 seconds for 5h40m and queues its own successor when it starts, which
    # waits in the concurrency queue and takes over as the current one ends. GitHub starts schedules late and drops most
    # (three of 24 hourly runs on 2026-11-02, and the keeper stopped at 21:31 UTC with none queued), so the chain does
    # not rely on them. A keeper code change applies from the next run: cancel the current one and the queued one
    # starts at once on the tip of master.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      # To dispatch the next run (a workflow_dispatch from GITHUB_TOKEN is the one event that does start a run).
      actions: write
    steps:
      # Only one run waits in the concurrency queue: a newer one replaces it, so there is always exactly one successor.
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keeper.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
      # The branch tip when this run starts, not when it was queued 5h40m earlier.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every 15 seconds, three ledgers: the router decides each tick on-chain and cooldowns live there, so a shorter
      # interval only means rules fire sooner. What caps a wallet is the policy's rate limit (40 calls per 2000
      # ledgers, a swap tick is 3 or 4), not this interval.
      - name: Tick every 15 seconds for 5h40m
        working-directory: keeper
        env:
          KEEPER_SECRET: ${{ secrets.KEEPER_SECRET }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          ROUTER_V1: ${{ vars.ROUTER_V1 || 'CD5VSBUXQ4OQIVYI55CFF4C4YKSFQUY4OTFIOFJRNC6TUILMNN7MAO2D' }}
          KOUL_POLICY: ${{ vars.KOUL_POLICY || 'CAKEUMCIW4KBQZI5OJMFHFGM5VHDZHWIXAO7JOKTBRPR63IHIEP7KKNZ' }}
          MOCK_FX: ${{ vars.MOCK_FX || 'CB6VNXADXR3XHCS4EKV5ZR5UJUZYQ5BZTPRHCNQE3XMKQMB4LJG6MKW2' }}
          # One tick worker per channel account; leases.yml funds the same number.
          KEEPER_CHANNELS: 32
          # The heartbeat the app reads ("Last check 12 s ago") and the stale alert watches.
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: timeout 340m pnpm keeper -- --interval 15 --quiet || [ $? -eq 124 ]
